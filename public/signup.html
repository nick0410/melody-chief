<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — MelodyChief</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-container">
    <div class="heading">
      <h1>Join MelodyChief</h1>
    </div>
    <form action="/signup" method="POST">
      <label for="sname">Full Name</label>
      <input type="text" name="name" id="sname" placeholder="Your full name" required>
      <label for="semail">Email</label>
      <input type="email" name="email" id="semail" placeholder="your@email.com" required>
      <label for="spassword">Password</label>
      <input type="password" name="password" id="spassword" placeholder="Min 6 characters" required>
      <label for="sphone">Phone Number</label>
      <input type="text" name="phone" id="sphone" placeholder="Your phone number" required>
      <button type="submit">✨ Create Account</button>
    </form>
    <p><a href="/">← Already have an account? Log in</a></p>
    <p id="error-message"></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
